# Manual release: builds the OS image and publishes it as a GitHub release.
#
# Trigger: Actions tab -> "Manual release" -> "Run workflow" (never on push).
# Inputs: version (tag to create, e.g. v0.1.0), optional notes, prerelease flag.
# Output: release <version> with os.img, boot.bin and kernel.bin attached.

name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to create (e.g. v0.1.0). Fails if it already exists.'
        required: true
        type: string
      notes:
        description: 'Release notes (optional).'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write # Required for gh release create (tag + release + assets).

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history so existing tags can be detected.

      - name: Abort if tag already exists
        run: |
          if git rev-parse "refs/tags/${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.version }} already exists. Pick another version."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib build-essential qemu-system-x86

      - name: Build image
        run: |
          chmod +x scripts/compile_workflow.sh
          ./scripts/compile_workflow.sh

      - name: Verify artifacts
        run: |
          ls -lh bin/
          test -f bin/os.img
          test -f bin/boot.bin
          test -f bin/kernel.bin

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="${{ inputs.notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="FS-Os image ${{ inputs.version }}."
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            gh release create "${{ inputs.version }}" \
              --title "${{ inputs.version }}" \
              --notes "$NOTES" \
              --prerelease \
              bin/os.img bin/boot.bin bin/kernel.bin
          else
            gh release create "${{ inputs.version }}" \
              --title "${{ inputs.version }}" \
              --notes "$NOTES" \
              bin/os.img bin/boot.bin bin/kernel.bin
          fi
